[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sudo-hub"
version = "0.1.0"
description = "Phone-first, passkey-authorized privileged operation broker"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["cryptography>=43", "pywebpush>=2.0.3"]

[project.urls]
Homepage = "https://github.com/devslash-paul/sudo-hub"
Repository = "https://github.com/devslash-paul/sudo-hub"
Issues = "https://github.com/devslash-paul/sudo-hub/issues"

[project.scripts]
sudo-hub-server = "sudo_hub.server:main"
sudo-hub-request = "sudo_hub.client:main"
sudo-hub-executor = "sudo_hub.executor:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.package-data]
sudo_hub = ["static/*"]

[tool.setuptools.data-files]
"share/sudo-hub/deploy" = [
  "deploy/README.md",
  "deploy/*.service",
  "deploy/*.sh",
  "deploy/*.svg",
  "deploy/*.example",
  "deploy/sudo-hub-spoke-request",
]
