[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-sudo-approval"
version = "0.1.0"
description = "Phone-first, passkey-authorized privileged operation broker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=43", "pywebpush>=2.0.3"]

[project.scripts]
codex-approval-server = "codex_approval.server:main"
codex-approval-request = "codex_approval.client:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.package-data]
codex_approval = ["static/*"]
